name: RAG Test Suite

on:
  push:
    branches:
      - multi-modal_RAG
  workflow_dispatch:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      RUN_OLLAMA_TESTS: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install             pytest pytest-asyncio numpy requests beautifulsoup4 ddgs             rank-bm25 tiktoken sentence-transformers pymupdf pillow pypdf             langchain-core langchain-community langchain-ollama             langchain-chroma langchain-text-splitters chromadb

      - name: Run focused deterministic suite
        run: |
          pytest -q             tests/test_chunking.py             tests/test_pipeline_unit.py             tests/test_embedding_contracts.py             tests/test_multimodal.py             tests/test_multimodal_edges.py             tests/test_pipeline_e2e_mocked.py             -m "not live_ollama"             --disable-warnings

      - name: Run legacy Layer 1 regression suite
        run: |
          pytest -q test_suite.py             -m "layer1 and not live_ollama"             --disable-warnings             --maxfail=1
